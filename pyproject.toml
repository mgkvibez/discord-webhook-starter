[project]
name = "discord-webhook-starter"
version = "0.1.0"
description = "The simplest correct Discord slash-command bot: one FastAPI file, signed interactions, no gateway loop"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
